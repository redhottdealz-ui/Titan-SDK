name: Titan SDK Reliability CI

on:
  pull_request:
    paths:
      - 'titan_sdk/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/sdk-reliability-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Compile SDK modules
        run: |
          python -m py_compile titan_sdk/client.py
          python -m py_compile titan_sdk/communications.py
          python -m py_compile titan_sdk/heartbeat.py
          python -m py_compile titan_sdk/capabilities.py
          python -m py_compile titan_sdk/retry.py
          python -m py_compile titan_sdk/health.py
          python -m py_compile titan_sdk/reliability.py

      - name: Run Titan SDK regressions
        run: python -m pytest tests -q
